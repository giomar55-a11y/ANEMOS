<!DOCTYPE html>

<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ANEMOS – Test Motore di Coerenza
    </title>

    <style>

        body {
            margin: 0;
            padding: 20px;

            font-family:
                Arial,
                sans-serif;

            background: #f5f5f2;
            color: #111;
        }


        h1 {
            margin-top: 0;
            font-size: 26px;
        }


        #risultati {
            display: grid;
            gap: 14px;
        }


        .test-card {
            background: #fff;

            border:
                1px solid #d8d8d2;

            border-radius: 14px;
            padding: 16px;

            box-sizing:
                border-box;
        }


        .test-card h2 {
            margin:
                0 0 12px;

            font-size: 18px;
        }


        .test-card h3 {
            margin:
                16px 0 8px;

            font-size: 16px;
        }


        .riga {
            display: flex;

            justify-content:
                space-between;

            align-items:
                flex-start;

            gap: 16px;

            padding:
                4px 0;

            border-bottom:
                1px solid #eeeeea;
        }


        .riga:last-child {
            border-bottom: 0;
        }


        .etichetta {
            font-weight: 700;
        }


        .valore {
            text-align: right;
        }


        .semaforo {
            display:
                inline-flex;

            align-items:
                center;

            gap: 8px;

            font-weight: 700;
        }


        .pallino {
            width: 14px;
            height: 14px;

            border-radius:
                50%;

            flex:
                0 0 auto;
        }


        .verde {
            background:
                #70b88a;
        }


        .giallo {
            background:
                #e3c65e;
        }


        .rosso {
            background:
                #cf6f6f;
        }


        @media (
            max-width: 700px
        ) {

            body {
                padding: 12px;
            }


            .riga {
                gap: 10px;
            }


            .etichetta {
                max-width: 48%;
            }


            .valore {
                max-width: 52%;

                overflow-wrap:
                    anywhere;
            }

        }

    </style>

</head>

<body>

    <h1>
        Motore di Coerenza ANEMOS
    </h1>


    <p>
        Banco di prova indipendente.
    </p>


    <div id="risultati"></div>


    <script>

        const risultatiTest =
            [];


        const risultatiApnee =
            [];


        const consoleOriginale =
            console.log;


        console.log =
            function (...argomenti) {

                consoleOriginale(
                    ...argomenti
                );


                if (
                    argomenti[0] ===
                    "Valutazione:"
                ) {

                    risultatiTest.push(
                        argomenti[1]
                    );

                }


                if (
                    argomenti[0] ===
                    "Valutazione apnea:"
                ) {

                    risultatiApnee.push(
                        argomenti[1]
                    );

                }

            };

    </script>


    <script src="model-3-1.js"></script>

    <script
        src="motore-coerenza-test.js?v=48"
    ></script>


    <script>

        const contenitore =
            document.getElementById(
                "risultati"
            );


        function aggiungiRiga(
            card,
            chiave,
            valore
        ) {

            const riga =
                document.createElement(
                    "div"
                );


            riga.className =
                "riga";


            const etichetta =
                document.createElement(
                    "span"
                );


            etichetta.className =
                "etichetta";


            etichetta.textContent =
                chiave;


            const contenuto =
                document.createElement(
                    "span"
                );


            contenuto.className =
                "valore";


            contenuto.textContent =
                valore ?? "-";


            riga.appendChild(
                etichetta
            );


            riga.appendChild(
                contenuto
            );


            card.appendChild(
                riga
            );

        }


        function aggiungiSemaforo(
            card,
            colore,
            etichetta = "Semaforo"
        ) {

            const coloreValido =
                [
                    "verde",
                    "giallo",
                    "rosso"
                ].includes(
                    colore
                )

                    ? colore

                    : "rosso";


            const riga =
                document.createElement(
                    "div"
                );


            riga.className =
                "riga";


            const nome =
                document.createElement(
                    "span"
                );


            nome.className =
                "etichetta";


            nome.textContent =
                etichetta;


            const semaforo =
                document.createElement(
                    "span"
                );


            semaforo.className =
                "semaforo";


            const pallino =
                document.createElement(
                    "span"
                );


            pallino.className =
                "pallino " +
                coloreValido;


            const testo =
                document.createElement(
                    "span"
                );


            testo.textContent =
                coloreValido;


            semaforo.appendChild(
                pallino
            );


            semaforo.appendChild(
                testo
            );


            riga.appendChild(
                nome
            );


            riga.appendChild(
                semaforo
            );


            card.appendChild(
                riga
            );

        }


        function valoreLista(
            valore,
            separatore = ", ",
            vuoto = "-"
        ) {

            if (
                !Array.isArray(
                    valore
                )
            ) {

                return vuoto;

            }


            if (
                valore.length === 0
            ) {

                return vuoto;

            }


            return valore.join(
                separatore
            );

        }


        /* =====================================================
           RISULTATI DEGLI ANEMOMERI
        ===================================================== */

        risultatiTest.forEach(
            (
                risultato,
                indice
            ) => {

                const card =
                    document.createElement(
                        "section"
                    );


                card.className =
                    "test-card";


                const titolo =
                    document.createElement(
                        "h2"
                    );


                titolo.textContent =
                    "Test " +
                    (
                        indice + 1
                    );


                card.appendChild(
                    titolo
                );


                const dati = {

                    Tipo:
                        risultato.tipo ?? "-",

                    Durata:
                        risultato.durata ?? "-",

                    Percorso:
                        risultato.percorso ?? "-",

                    "Percorso valido":
                        risultato.percorsoValido ?? "-",

                    "Punteggio percorso":
                        risultato.punteggioPercorso ?? "-",

                    "Motivazione percorso":
                        risultato.motivazionePercorso ?? "-",

                    "Biomeccanica valida":
                        risultato.biomeccanicaValida ?? "-",

                    "Punteggio biomeccanica":
                        risultato.punteggioBiomeccanica ?? "-",

                    "Errori biomeccanica":
                        Array.isArray(
                            risultato.erroriBiomeccanica
                        )

                            ? (
                                risultato
                                    .erroriBiomeccanica
                                    .length > 0

                                    ? risultato
                                        .erroriBiomeccanica
                                        .join(
                                            " | "
                                        )

                                    : "Nessun errore"
                            )

                            : "-",

                    "Motivazione biomeccanica":
                        risultato.motivazioneBiomeccanica ?? "-",

                    "Temporale valida":
                        risultato.temporaleValida ?? "-",

                    "Punteggio temporale":
                        risultato.punteggioTemporale ?? "-",

                    "Indice temporale":
                        risultato.indiceTemporale ?? "-",

                    "Motivazione temporale":
                        risultato.motivazioneTemporale ?? "-",

                    "Distribuzione settori valida":
                        risultato.distribuzioneSettoriValida ?? "-",

                    "Distribuzione settori":
                        risultato.distribuzioneSettori ?? "-",

                    "Numero settori coinvolti":
                        risultato.numeroSettoriCoinvolti ?? "-",

                    "Settori coinvolti":
                        valoreLista(
                            risultato.settoriCoinvolti
                        ),

                    "Settori dominanti":
                        valoreLista(
                            risultato.settoriDominanti
                        ),

                    "Motivazione settori":
                        risultato.motivazioneSettori ?? "-",

                    Flusso:
                        risultato.flusso ?? "-",

                    "Variazione totale":
                        risultato.variazioneTotale ?? "-",

                    Indice:
                        risultato.indice ?? "-",

                    Ideale:
                        risultato.ideale ?? "-",

                    Errore:
                        risultato.errore ?? "-",

                    Direzione:
                        risultato.direzione ?? "-",

                    Punteggio:
                        risultato.punteggio ?? "-",

                    Motivazione:
                        risultato.motivazione ?? "-",

                    "Coerenza complessiva":
                        risultato.coerenzaComplessivaValida ?? "-",

                    "Punteggio complessivo":
                        risultato.punteggioComplessivo ?? "-",

                    "Semaforo complessivo":
                        risultato.semaforoComplessivo ?? "-",

                    "Criticità":
                        Array.isArray(
                            risultato.criticitaComplessive
                        )

                            ? (
                                risultato
                                    .criticitaComplessive
                                    .length > 0

                                    ? risultato
                                        .criticitaComplessive
                                        .join(
                                            " | "
                                        )

                                    : "Nessuna"
                            )

                            : "-",

                    "Motivazione complessiva":
                        risultato.motivazioneComplessiva ?? "-"

                };


                Object.entries(
                    dati
                ).forEach(
                    (
                        [
                            chiave,
                            valore
                        ]
                    ) => {

                        aggiungiRiga(
                            card,
                            chiave,
                            valore
                        );

                    }
                );


                if (
                    Array.isArray(
                        risultato.variazioniSettori
                    ) &&
                    risultato
                        .variazioniSettori
                        .length > 0
                ) {

                    const titoloSettori =
                        document.createElement(
                            "h3"
                        );


                    titoloSettori.textContent =
                        "Settori";


                    card.appendChild(
                        titoloSettori
                    );


                    risultato
                        .variazioniSettori
                        .forEach(
                            settore => {

                                const segno =
                                    settore.finale >
                                    settore.iniziale

                                        ? "+"

                                        : settore.finale <
                                          settore.iniziale

                                            ? "−"

                                            : "=";


                                const descrizione =
                                    settore.iniziale +
                                    " → " +
                                    settore.finale +
                                    " (" +
                                    segno +
                                    settore.variazione +
                                    ")";


                                aggiungiRiga(
                                    card,
                                    settore.settore,
                                    descrizione
                                );

                            }
                        );

                }


                aggiungiSemaforo(
                    card,
                    risultato.semaforo
                );


                contenitore.appendChild(
                    card
                );

            }
        );


        /* =====================================================
           RISULTATI DELLE APNEE
        ===================================================== */

        risultatiApnee.forEach(
            (
                risultato,
                indice
            ) => {

                const card =
                    document.createElement(
                        "section"
                    );


                card.className =
                    "test-card";


                const titolo =
                    document.createElement(
                        "h2"
                    );


                titolo.textContent =
                    "Apnea " +
                    (
                        indice + 1
                    );


                card.appendChild(
                    titolo
                );


                const datiApnea = {

                    Durata:
                        risultato.durata ?? "-",

                    Precedente:
                        risultato.precedente ?? "-",

                    Successivo:
                        risultato.successivo ?? "Finale",

                    "Durata valida":
                        risultato.durataValida ?? "-",

                    "Posizione valida":
                        risultato.posizioneValida ?? "-",

                    Valida:
                        risultato.valido ?? "-",

                    Punteggio:
                        risultato.punteggio ?? "-",

                    Errori:
                        Array.isArray(
                            risultato.errori
                        )

                            ? (
                                risultato
                                    .errori
                                    .length > 0

                                    ? risultato
                                        .errori
                                        .join(
                                            " | "
                                        )

                                    : "Nessun errore"
                            )

                            : "-",

                    Motivazione:
                        risultato.motivazione ?? "-"

                };


                Object.entries(
                    datiApnea
                ).forEach(
                    (
                        [
                            chiave,
                            valore
                        ]
                    ) => {

                        aggiungiRiga(
                            card,
                            chiave,
                            valore
                        );

                    }
                );


                const coloreApnea =
                    risultato.valido

                        ? "verde"

                        : "rosso";


                aggiungiSemaforo(
                    card,
                    coloreApnea
                );


                contenitore.appendChild(
                    card
                );

            }
        );


        if (
            risultatiTest.length === 0 &&
            risultatiApnee.length === 0
        ) {

            contenitore.textContent =
                "Nessun risultato rilevato.";

        }

    </script>

</body>

</html>
