<script>

const selettoreLingua =
    document.getElementById(
        "selettore-lingua"
    );

const titoloBrand =
    document.querySelector(
        ".brand"
    );

    const pulsanteModalitaAnemodromo =
    document.getElementById(
        "modalita-anemodromo"
    );

const pulsanteModalitaAnemosystema =
    document.getElementById(
        "modalita-anemosystema"
    );

    const titoloAnemodromo =
    document.getElementById(
        "titolo-anemodromo"
    );

const titoloAnemosystema =
    document.getElementById(
        "titolo-anemosystema"
    );

    const pulsanteSpostaAnemodromo =
    document.getElementById(
        "sposta-anemodromo"
    );

    const pulsanteEliminaAnemosystema =
    document.getElementById(
        "elimina-anemosystema"
    );

    const etichettaAnemosinthesis =
    document.getElementById(
        "etichetta-anemosinthesis"
    );

const etichettaAnemobaros =
    document.getElementById(
        "etichetta-anemobaros"
    );

const etichettaAnemoschesi =
    document.getElementById(
        "etichetta-anemoschesi"
    );

function aggiornaLinguaInterfaccia() {

    titoloBrand.textContent =
        anemosTermine(
            "ANEMOS"
        );

    if (
        anemosOttieniLingua() ===
        ANEMOS_LINGUA.ITALIANO
    ) {

        pulsanteModalitaAnemodromo.textContent =
            "composizione atto respiratorio";

        pulsanteModalitaAnemosystema.textContent =
            "composizione sequenza atti respiratori";

        titoloAnemodromo.textContent =
    "Atto respiratorio";

titoloAnemosystema.textContent =
    "Sequenza di atti respiratori";

    pulsanteSpostaAnemodromo.textContent =
    "AGGIUNGI ALLA SEQUENZA";   

    pulsanteEliminaAnemosystema.textContent =
    "ELIMINA SEQUENZA";

    etichettaAnemosinthesis.textContent =
    "COMPLESSITÀ";

etichettaAnemobaros.textContent =
    "INTENSITÀ";

etichettaAnemoschesi.textContent =
    "COERENZA";    

    pulsanteLinguaAggiungiIN.textContent =
    "+ INSPIRAZIONE";

pulsanteLinguaAggiungiES.textContent =
    "+ ESPIRAZIONE";    

    } else {

        pulsanteModalitaAnemodromo.textContent =
            "Composizione guidata ANEMODROMO";

        pulsanteModalitaAnemosystema.textContent =
            "Composizione libera ANEMOSYSTEMA";

    titoloAnemodromo.textContent =
    "ANEMODROMO";

titoloAnemosystema.textContent =
    "ANEMOSYSTEMA";   

  pulsanteSpostaAnemodromo.textContent =
    "SPOSTA IN ANEMOSYSTEMA";      

    pulsanteEliminaAnemosystema.textContent =
    "Elimina ANEMOSYSTEMA";

    etichettaAnemosinthesis.textContent =
    "ANEMOSINTHESIS";

etichettaAnemobaros.textContent =
    "ANEMOBAROS";

etichettaAnemoschesi.textContent =
    "ANEMOSCHESI";    

    pulsanteLinguaAggiungiIN.textContent =
    "+ IN";

pulsanteLinguaAggiungiES.textContent =
    "+ ES";    
        
    }

}

selettoreLingua.value =
    anemosOttieniLingua();


selettoreLingua.addEventListener(
    "change",
    function () {

        anemosImpostaLingua(
            selettoreLingua.value
        );

        aggiornaLinguaInterfaccia();

    }
);


aggiornaLinguaInterfaccia();
    
    /*
    =================================================
    ANEMOS 3.1
    COLLEGAMENTO DELLA PAGINA
    =================================================
*/

        const pulsanteAggiungiIN =
            document.getElementById(
                "aggiungi-in"
            );


        const pulsanteAggiungiES =
            document.getElementById(
                "aggiungi-es"
            );
function aggiornaDisponibilitaAggiunta() {

    const stato =
        statoSettoriFinale(
            anemos31
        );


    const tuttiPieni =
        stato[
            ANEMOS_SETTORI.ADDOME
        ] === 4 &&
        stato[
            ANEMOS_SETTORI.TORACE_INFERIORE
        ] === 4 &&
        stato[
            ANEMOS_SETTORI.TORACE_SUPERIORE
        ] === 4;


    const tuttiVuoti =
        stato[
            ANEMOS_SETTORI.ADDOME
        ] === 0 &&
        stato[
            ANEMOS_SETTORI.TORACE_INFERIORE
        ] === 0 &&
        stato[
            ANEMOS_SETTORI.TORACE_SUPERIORE
        ] === 0;


    /*
    Limite assoluto dell'Anemodromo:
    massimo 12 Anemomeri.
    */

    const limiteRaggiunto =
        anemos31.anemodromi.length >=
        ANEMOS_MAX_ANEMOMERI;

pulsanteAggiungiIN.classList.toggle(
    "limite-raggiunto",
    limiteRaggiunto
);


pulsanteAggiungiES.classList.toggle(
    "limite-raggiunto",
    limiteRaggiunto
);
    pulsanteAggiungiIN.disabled =
        tuttiPieni ||
        limiteRaggiunto;


    pulsanteAggiungiES.disabled =
        tuttiVuoti ||
        limiteRaggiunto;

}
        const pulsanteElimina =
            document.getElementById(
                "elimina-anemodromo"
            );

        const pulsanteEliminaTutto =
            document.getElementById(
                "elimina-tutto"
                
    );
        const pulsanteConferma =
            document.getElementById(
                "conferma-anemodromo"
            );


        const durataTotale =
            document.getElementById(
                "durata-totale"
            );

    const anemosinthesisEsito =
    document.getElementById(
        "anemosinthesis-esito"
    );
    
    const anemobarosEsito =
    document.getElementById(
        "anemobaros-esito"
    );

    


        /*
        -----------------------------------------------
        Aggiunta Anemodromi
        -----------------------------------------------
        */

        pulsanteAggiungiIN
            .addEventListener(
                "click",
                function () {

                    const nuovo =
                        aggiungiNuovoAnemodromo(
                            ANEMOS_TIPI.IN
                        );


                    apriEditor(
                        nuovo.id
                    );


                    aggiornaDurataTotale();

                }
            );


        pulsanteAggiungiES
            .addEventListener(
                "click",
                function () {

                    const nuovo =
                        aggiungiNuovoAnemodromo(
                            ANEMOS_TIPI.ES
                        );


                    apriEditor(
                        nuovo.id
                    );


                    aggiornaDurataTotale();

                }
            );



        /*
        -----------------------------------------------
        Eliminazione Anemodromo
        -----------------------------------------------
        */

        pulsanteElimina
            .addEventListener(
                "click",
                function () {

                    if (
                        !anemodromoSelezionatoId
                    ) {

                        return;

                    }


                    eliminaAnemodromo(
    sequenzaEditorAttiva ||
        anemos31,
    anemodromoSelezionatoId
);

                    const editorDaAnemosystema =
    Boolean(sequenzaEditorAttiva);

chiudiEditorAnemodromo();

if (!editorDaAnemosystema) {

    aggiornaDurataTotale();
    
}
                }
            );
/*
-----------------------------------------------
Eliminazione intera sequenza
-----------------------------------------------
*/

pulsanteEliminaTutto
    .addEventListener(
        "click",
        async function () {

            const conferma =
                await anemosConferma(
                    "Eliminare tutti gli Anemomeri e tutte le apnee dell’Anemodromo?",
                    "Elimina anemodromo"
                );
            
            if (!conferma) {
                return;
            }

            anemos31.anemodromi = [];

    function renderAnemosystema() {

    ottieniAnemodromiOrdinati(

const timelineBlocco =
    document.createElement(
        "div"
    );

    "anemosystema-timeline-blocco";

sequenzaAnemomeri.forEach(
    function (
        anemomero,
        indiceAnemomero
    ) {

        const nodo =
    creaNodoAnemodromo(
        anemomero,
        indiceAnemomero,
        function () {

            const anemos31Originale =
                anemos31;

            anemos31 =
                blocco.sequenza;

            apriEditor(
    anemomero.id,
    blocco.sequenza
);
            anemos31 =
                anemos31Originale;
        }
    );
        timelineBlocco.appendChild(
            nodo
        );
        const successivo =
    sequenzaAnemomeri[
        indiceAnemomero + 1
    ] || null;

const apnea =
    trovaApneaTra(
        blocco.sequenza,
        anemomero.id,
        successivo

);

    );
}    }
);

valoreCicli.textContent =

const piuCicli =

);

);

);

);

elemento.appendChild(

);

elemento.appendChild(
    timelineBlocco
);            contenitore.appendChild(
                elemento
            );
        }
    );
}

   function popolaSelettoreIntenti() {

    if (
        !selettoreIntento
    ) {

        return;

    }


    selettoreIntento.innerHTML =
        "";

    ANEMOSCHESI_ELENCO_MACROAREE.forEach(
        macroarea => {

            const gruppo =
                document.createElement(
                    "optgroup"
                );


            gruppo.label =
                macroarea.nome;


            macroarea.intenti.forEach(
                intento => {

                    const opzione =
                        document.createElement(
                            "option"
                        );


                    opzione.value =
                        intento.id;


                    opzione.textContent =
                        intento.nome;


                    gruppo.appendChild(
                        opzione
                    );

                }
            );


            selettoreIntento.appendChild(
                gruppo
            );

        }
    );


    const intentoSalvato =
        localStorage.getItem(
            "ANEMOS_INTENTO_SELEZIONATO"
        );

        intentoSalvato
    ) {

        impostaIntento(
            anemos31,
            intentoSalvato
        );


        selettoreIntento.value =
            intentoSalvato;

    }

}

}

    );
