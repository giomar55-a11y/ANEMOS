    <script>

        /*
        =================================================
        ANEMOS 3.1
        COLLEGAMENTO DELLA PAGINA
        =================================================
        */


        const pulsanteAggiungiIN =
            document.getElementById(
                "aggiungi-in"
            );


        const pulsanteAggiungiES =
            document.getElementById(
                "aggiungi-es"
            );
function aggiornaDisponibilitaAggiunta() {

    const stato =
        statoSettoriFinale(
            anemos31
        );


    const tuttiPieni =
        stato[
            ANEMOS_SETTORI.ADDOME
        ] === 4 &&
        stato[
            ANEMOS_SETTORI.TORACE_INFERIORE
        ] === 4 &&
        stato[
            ANEMOS_SETTORI.TORACE_SUPERIORE
        ] === 4;


    const tuttiVuoti =
        stato[
            ANEMOS_SETTORI.ADDOME
        ] === 0 &&
        stato[
            ANEMOS_SETTORI.TORACE_INFERIORE
        ] === 0 &&
        stato[
            ANEMOS_SETTORI.TORACE_SUPERIORE
        ] === 0;


    /*
    Limite assoluto dell'Anemodromo:
    massimo 12 Anemomeri.
    */

    const limiteRaggiunto =
        anemos31.anemodromi.length >=
        ANEMOS_MAX_ANEMOMERI;

pulsanteAggiungiIN.classList.toggle(
    "limite-raggiunto",
    limiteRaggiunto
);


pulsanteAggiungiES.classList.toggle(
    "limite-raggiunto",
    limiteRaggiunto
);
    pulsanteAggiungiIN.disabled =
        tuttiPieni ||
        limiteRaggiunto;


    pulsanteAggiungiES.disabled =
        tuttiVuoti ||
        limiteRaggiunto;

}
        const pulsanteElimina =
            document.getElementById(
                "elimina-anemodromo"
            );

        const pulsanteEliminaTutto =
            document.getElementById(
                "elimina-tutto"
                
    );
        const pulsanteConferma =
            document.getElementById(
                "conferma-anemodromo"
            );


        const durataTotale =
            document.getElementById(
                "durata-totale"
            );



        /*
        -----------------------------------------------
        Aggiunta Anemodromi
        -----------------------------------------------
        */

        pulsanteAggiungiIN
            .addEventListener(
                "click",
                function () {

                    const nuovo =
                        aggiungiNuovoAnemodromo(
                            ANEMOS_TIPI.IN
                        );


                    apriEditor(
                        nuovo.id
                    );


                    aggiornaDurataTotale();

                }
            );


        pulsanteAggiungiES
            .addEventListener(
                "click",
                function () {

                    const nuovo =
                        aggiungiNuovoAnemodromo(
                            ANEMOS_TIPI.ES
                        );


                    apriEditor(
                        nuovo.id
                    );


                    aggiornaDurataTotale();

                }
            );



        /*
        -----------------------------------------------
        Eliminazione Anemodromo
        -----------------------------------------------
        */

        pulsanteElimina
            .addEventListener(
                "click",
                function () {

                    if (
                        !anemodromoSelezionatoId
                    ) {

                        return;

                    }


                    eliminaAnemodromo(
                        anemos31,
                        anemodromoSelezionatoId
                    );


                    chiudiEditorAnemodromo();


                    aggiornaDurataTotale();

                }
            );
/*
-----------------------------------------------
Eliminazione intera sequenza
-----------------------------------------------
*/

pulsanteEliminaTutto
    .addEventListener(
        "click",
        function () {

            const conferma =
                window.confirm(
                    "Eliminare tutti gli Anemodromi e tutte le apnee della sequenza?"
                );

            if (!conferma) {
                return;
            }

            anemos31.anemodromi = [];
            anemos31.ordine = [];
            anemos31.apnee = [];

            anemodromoSelezionatoId = null;

            const editor =
                document.getElementById(
                    "editor-anemodromo"
                );

            if (editor) {
                editor.classList.remove(
                    "aperto"
                );
            }

            renderAnemos31();

        }
    );


        /*
        -----------------------------------------------
        Conferma editor
        -----------------------------------------------
        */

        pulsanteConferma
            .addEventListener(
                "click",
                function () {

                    chiudiEditorAnemodromo();

                    aggiornaDurataTotale();

                }
            );



        /*
        -----------------------------------------------
        Durata totale
        -----------------------------------------------
        */

        function aggiornaDurataTotale() {

            let totale = 0;


            const anemodromi =
                ottieniAnemodromiOrdinati(
                    anemos31
                );


            anemodromi.forEach(
                function (
                    anemodromo
                ) {

                    totale +=
                        anemodromo.durata;

                }
            );


            anemos31.apnee.forEach(
                function (
                    apnea
                ) {

                    totale +=
                        apnea.durata;

                }
            );


            durataTotale.textContent =
                totale + " s";

        }



        /*
        -----------------------------------------------
        Aggiornamento automatico durata
        -----------------------------------------------

        Manteniamo il render originale,
        aggiungendo il calcolo totale.
        */

        const renderOriginaleAnemos31 =
            renderAnemos31;


        renderAnemos31 =
    function () {

        renderOriginaleAnemos31();

        aggiornaDurataTotale();

        aggiornaDisponibilitaAggiunta();

    };


        /*
        -----------------------------------------------
        Avvio applicazione
        -----------------------------------------------
        */

        inizializzaUIAnemos31();

        aggiornaDurataTotale();

        aggiornaDisponibilitaAggiunta();

    </script>
<script>

    /*
    =================================================
    SELETTORE INTENTO ANEMOSCHESI
    =================================================
    */

    const selettoreIntento =
        document.getElementById(
            "selettore-intento"
        );


   function popolaSelettoreIntenti() {

    if (
        !selettoreIntento
    ) {

        return;

    }


    selettoreIntento.innerHTML =
        "";


    const opzioneLibera =
        document.createElement(
            "option"
        );


    opzioneLibera.value =
        "";


    opzioneLibera.textContent =
        "Nessun intento";


    selettoreIntento.appendChild(
        opzioneLibera
    );


    ANEMOSCHESI_ELENCO_MACROAREE.forEach(
        macroarea => {

            const gruppo =
                document.createElement(
                    "optgroup"
                );


            gruppo.label =
                macroarea.nome;


            macroarea.intenti.forEach(
                intento => {

                    const opzione =
                        document.createElement(
                            "option"
                        );


                    opzione.value =
                        intento.id;


                    opzione.textContent =
                        intento.nome;


                    gruppo.appendChild(
                        opzione
                    );

                }
            );


            selettoreIntento.appendChild(
                gruppo
            );

        }
    );


    const intentoSalvato =
        localStorage.getItem(
            "ANEMOS_INTENTO_SELEZIONATO"
        );


    if (
        intentoSalvato
    ) {

        impostaIntento(
            anemos31,
            intentoSalvato
        );


        selettoreIntento.value =
            intentoSalvato;

    }

}

    selettoreIntento.addEventListener(
        "change",
        function () {

            const intentoId =
                selettoreIntento.value ||
                null;


            impostaIntento(
                anemos31,
                intentoId
            );


            if (
                intentoId
            ) {

                localStorage.setItem(
                    "ANEMOS_INTENTO_SELEZIONATO",
                    intentoId
                );

            } else {

                localStorage.removeItem(
                    "ANEMOS_INTENTO_SELEZIONATO"
                );

            }


            localStorage.setItem(
                "ANEMOS_SEQUENZA_TEST",
                JSON.stringify(
                    anemos31
                )
            );
                renderAnemos31();
        }
    );


popolaSelettoreIntenti();
</script>
